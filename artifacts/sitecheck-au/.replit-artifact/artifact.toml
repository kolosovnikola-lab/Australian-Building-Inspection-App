kind = "web"
previewPath = "/"
title = "SiteCheck AU"
description = "A field-ready building and pest inspection app for Australian inspectors. Create inspections, record evidence and measurements, compare observed conditions against standards-based tolerances, and produce clear finding summaries with traceable references."
version = "1.0.0"
id = "artifacts/sitecheck-au"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21328

[services.development]
run = "pnpm --filter @workspace/sitecheck-au run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sitecheck-au", "run", "build" ]
serve = "static"
publicDir = "artifacts/sitecheck-au/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21328"
BASE_PATH = "/"
